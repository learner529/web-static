<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>泓涵教育 · 在线咨询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --navy: #16283f;
    --navy-2: #101d30;
    --brand: #2f6bff;
    --brand-deep: #1f4fd6;
    --chat-bg: #ededed;
    --bubble-ai: #ffffff;
    --bubble-user: #95ec69;
    --text: #1a1a1a;
    --sub: #8a8a8a;
  }
  html, body { height: 100%; }
  body {
    background: #0b1522;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
  }
  /* ===== 手机容器 ===== */
  .phone {
    width: 100%; max-width: 480px; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--chat-bg);
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,.5);
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    background: linear-gradient(180deg, var(--navy), var(--navy-2));
    color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .topbar .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #3d7bff, #1f4fd6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    box-shadow: 0 2px 8px rgba(47,107,255,.45);
  }
  .topbar .info { flex: 1; min-width: 0; }
  .topbar .info b { font-size: 15.5px; display: block; letter-spacing: .5px; }
  .topbar .info span { font-size: 11.5px; color: #9fb3d1; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; }
  .script-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 8px 14px;
    font-size: 12.5px; cursor: pointer;
    transition: transform .15s ease, background .15s ease;
    backdrop-filter: blur(4px);
  }
  .script-btn:active { transform: scale(.94); background: rgba(255,255,255,.22); }
  .script-btn.playing { background: var(--brand); border-color: var(--brand); }

  /* ===== 消息区 ===== */
  .chat {
    flex: 1; overflow-y: auto; padding: 14px 12px 10px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .time-divider {
    text-align: center; font-size: 11px; color: #a8a8a8; margin: 2px 0;
  }
  .msg { display: flex; gap: 8px; max-width: 88%; animation: msgIn .22s ease-out; flex-shrink: 0; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
  }
  .msg.ai .avatar { background: linear-gradient(135deg, #3d7bff, #1f4fd6); }
  .msg.user .avatar { background: linear-gradient(135deg, #4ade80, #16a34a); font-size: 13px; }
  .bubble {
    border-radius: 8px; padding: 10px 12px;
    font-size: 15px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .msg.ai .bubble { background: var(--bubble-ai); color: var(--text); }
  .msg.user .bubble { background: var(--bubble-user); color: #12310a; }
  .msg .name { font-size: 11px; color: #999; margin-bottom: 3px; }
  .msg.user .name { text-align: right; }

  /* 打字中 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: #b6b6b6;
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ===== 线索卡 ===== */
  .lead-card {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 16px rgba(22,40,63,.14);
    border: 1px solid #e3e8f0;
    animation: msgIn .3s ease-out;
    align-self: flex-start; max-width: 92%; flex-shrink: 0;
  }
  .lead-head {
    background: linear-gradient(135deg, var(--navy), var(--brand-deep));
    color: #fff; padding: 12px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .lead-head .cap {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .lead-head b { font-size: 14.5px; letter-spacing: .5px; }
  .lead-head span { font-size: 10.5px; color: #b9ccf0; display: block; }
  .lead-body { padding: 12px 14px; }
  .lead-row {
    display: flex; font-size: 13px; padding: 6px 0;
    border-bottom: 1px dashed #eef1f6;
  }
  .lead-row:last-child { border-bottom: none; }
  .lead-row .k { flex: 0 0 68px; color: #8a94a6; }
  .lead-row .v { flex: 1; color: #1f2937; font-weight: 500; }
  .lead-row .v .intent {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
  }
  .intent.high { background: #fff1ec; color: #e8542a; }
  .intent.mid { background: #fff8e6; color: #c08a00; }
  .intent.low { background: #eef3ff; color: #3b6ad4; }
  .lead-script { font-size: 12.5px !important; line-height: 1.55; color: #4b5563 !important; font-weight: 400 !important; }
  .lead-foot {
    background: #f0fdf4; color: #15803d;
    font-size: 12.5px; padding: 9px 14px;
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }

  /* ===== 快捷回复 ===== */
  .chips {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 0 12px 8px;
  }
  .chip {
    background: #fff; border: 1px solid #d7dce4; color: #44506a;
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: transform .15s ease, background .15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .chip:active { transform: scale(.95); background: #eef3ff; }

  /* ===== 输入栏 ===== */
  .inputbar {
    flex-shrink: 0;
    background: #f7f7f7; border-top: 1px solid #dcdcdc;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 8px;
  }
  .inputbar textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: #fff; border-radius: 8px;
    padding: 10px 12px; font-size: 15px; line-height: 1.4;
    max-height: 96px; font-family: inherit;
    box-shadow: inset 0 0 0 1px #e2e2e2;
  }
  .inputbar textarea:focus { box-shadow: inset 0 0 0 1.5px var(--brand); }
  .send-btn {
    flex-shrink: 0; border: none; cursor: pointer;
    background: var(--brand); color: #fff;
    border-radius: 8px; padding: 0 18px; height: 40px;
    font-size: 14.5px; font-weight: 600;
    transition: transform .15s ease, opacity .15s ease;
  }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { opacity: .4; cursor: default; transform: none; }

  /* ===== 演示中提示条 ===== */
  .demo-banner {
    position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(22,40,63,.92); color: #cfe0ff;
    font-size: 12px; padding: 6px 14px; border-radius: 999px;
    display: none; align-items: center; gap: 6px;
    z-index: 10; backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .demo-banner.show { display: flex; animation: msgIn .25s ease-out; }
  .demo-banner .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #fbbf24;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="phone">
  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="logo">泓</div>
    <div class="info">
      <b>泓涵教育 · 在线咨询</b>
      <span><i class="dot"></i>小涵 · AI 招生顾问在线</span>
    </div>
    <button class="script-btn" id="scriptBtn">▶ 演示剧本</button>
  </div>

  <!-- 演示中提示 -->
  <div class="demo-banner" id="demoBanner"><i class="pulse"></i>剧本演示中… 点击按钮可停止</div>

  <!-- 消息区 -->
  <div class="chat" id="chat"></div>

  <!-- 快捷回复 -->
  <div class="chips" id="chips"></div>

  <!-- 输入栏 -->
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="和小涵聊聊专升本…"></textarea>
    <button class="send-btn" id="sendBtn" disabled>发送</button>
  </div>
</div>

<script>
/* ================= 知识库与规则引擎 ================= */
var KB = {
  policy: "可以报的～ 浙江专升本只要是【全日制大专在校生或应届毕业生】都可以报名，大二正是准备的黄金时间 📚\n每年 3 月报名、4 月考试，统考科目是大学语文 / 高等数学 / 英语（按专业类别划分）+ 专业课。",
  subjects: "浙江专升本统考科目是按专业类别分的：\n· 文史 / 教育 / 艺术类 → 大学语文 + 英语\n· 理工 / 经管 / 农学 / 医学类 → 高等数学 + 英语\n另外再加一门专业课。你是什么专业呀？我帮你看看考哪几门～",
  price: "费用这块我跟你交个底：泓涵的课程分基础班、强化班、冲刺班，线上和线下结合，整体在几千到一万多这个区间，具体要看你选哪个班型、报几科 📋\n我这边不直接报具体数字，怕报不准误导你。帮你预约一位招生老师，老师会给你一份准确的报价和当期优惠，要吗？",
  refund: "这个问题我得跟你说实话～ 我们是正规办学机构，不会随口承诺「保过」「不过全退」这种不负责任的话 🙏\n不过你放心，泓涵有完整的课程服务协议和教学保障：6V1 全程督学、分层小班教学，历年学员的升本率是有数据支撑的。具体的协议条款和保障内容，建议你和招生老师当面详谈，老师会逐条给你讲清楚。我帮你预约一次免费咨询，好吗？",
  courses: "泓涵的课程是按基础分层的小班教学 👇\n· 基础班：从零梳理考纲，适合基础薄弱的同学\n· 强化班：考点精讲 + 真题训练，稳步提分\n· 冲刺班：考前押题串讲 + 全真模考\n配套的是我们的 6V1 服务：学习规划师、授课老师、班主任督学、心理辅导、学业答疑、生活老师，六个人围着你一个人转 💪\n浙江有多个校区，线上线下都能学。你目前基础怎么样？我帮你看看适合哪个班～",
  campus: "泓涵在浙江有多个校区，杭州、宁波、温州等地都有教学点，线上线下结合上课，你可以选离学校最近的校区 🏫\n具体校区地址和试听安排，招生老师会发定位给你。方便留个城市吗？我先帮你约个就近的试听～",
  booking: "好嘞～ 我已经帮你登记了 📮 招生老师会尽快联系你，给你做一对一的升本规划。你也可以留意微信消息，老师会先发一份【浙江专升本备考资料包】给你～"
};

var state;

function resetState() {
  state = {
    grade: null,       // 年级
    major: null,       // 专业
    foundation: null,  // 基础
    concerns: [],      // 关注点
    userTurns: 0,
    leadSent: false,
    demoPlaying: false,
    demoTimer: null
  };
}
resetState();

/* ================= DOM ================= */
var chat = document.getElementById('chat');
var input = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');
var chipsBox = document.getElementById('chips');
var scriptBtn = document.getElementById('scriptBtn');
var demoBanner = document.getElementById('demoBanner');

function scrollBottom() {
  requestAnimationFrame(function() { chat.scrollTop = chat.scrollHeight; });
}

function nowTime() {
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function addTimeDivider() {
  var el = document.createElement('div');
  el.className = 'time-divider';
  el.textContent = nowTime();
  chat.appendChild(el);
}

function addMsg(role, text, opts) {
  opts = opts || {};
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var avatarChar = role === 'ai' ? '涵' : '我';
  var nameHtml = role === 'ai' ? '<div class="name">小涵 · 泓涵教育</div>' : '';
  wrap.innerHTML =
    '<div class="avatar">' + avatarChar + '</div>' +
    '<div><div class="name" style="' + (role === 'user' ? 'display:none' : '') + '">' + '小涵 · 泓涵教育</div>' +
    '<div class="bubble"></div></div>';
  if (role === 'user') wrap.querySelector('.name').style.display = 'none';
  wrap.querySelector('.bubble').textContent = text;
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

var typingEl = null;
function showTyping() {
  hideTyping();
  typingEl = document.createElement('div');
  typingEl.className = 'msg ai';
  typingEl.innerHTML = '<div class="avatar">涵</div><div><div class="name">小涵 · 泓涵教育</div>' +
    '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>';
  chat.appendChild(typingEl);
  scrollBottom();
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function aiSay(text, delay, done) {
  showTyping();
  var wait = (delay == null) ? Math.min(600 + text.length * 22, 2200) : delay;
  setTimeout(function() {
    hideTyping();
    addMsg('ai', text);
    if (done) done();
  }, wait);
}

/* ================= 线索卡 ================= */
function addConcern(c) { if (state.concerns.indexOf(c) < 0) state.concerns.push(c); }

function computeIntent() {
  var score = 0;
  if (state.grade) score++;
  if (state.major) score++;
  if (state.foundation) score++;
  if (state.concerns.indexOf('费用') >= 0) score += 2;
  if (state.concerns.indexOf('课程') >= 0) score += 2;
  if (state.concerns.indexOf('保障') >= 0) score += 1;
  if (score >= 5) return { label: '高意向', cls: 'high', star: '★★★' };
  if (score >= 3) return { label: '中意向', cls: 'mid', star: '★★' };
  return { label: '低意向', cls: 'low', star: '★' };
}

function buildLeadScript() {
  var parts = [];
  if (state.grade === '大二') parts.push('大二备考正当时，主打「早准备上岸率更高」，可推基础班+强化班连报');
  else if (state.grade === '大一') parts.push('大一先培养意向，推基础班长线规划，保持社群触达');
  else if (state.grade) parts.push('时间紧迫，主打冲刺班 + 历年升本率数据，尽快安排试听');
  if (state.foundation === '偏弱') parts.push('基础偏弱，强调 6V1 督学和从零带学的案例');
  if (state.concerns.indexOf('费用') >= 0) parts.push('对价格敏感，邀约时用「免费咨询 + 当期优惠」吸引到店');
  if (state.concerns.indexOf('保障') >= 0) parts.push('关注考不上的风险，到店后重点讲服务协议和保障条款，切忌口头承诺');
  if (!parts.length) parts.push('信息较少，先做备考资料包触达，观察反馈');
  return parts.join('；');
}

function sendLeadCard() {
  if (state.leadSent) return;
  state.leadSent = true;
  var intent = computeIntent();
  var card = document.createElement('div');
  card.className = 'lead-card';
  card.innerHTML =
    '<div class="lead-head"><div class="cap">🎓</div><div><b>意向学员线索卡</b><span>泓涵教育 · AI 招生助手自动生成</span></div></div>' +
    '<div class="lead-body">' +
      row('年　　级', state.grade || '未知') +
      row('专　　业', state.major || '未知') +
      row('基　　础', state.foundation || '未提及') +
      row('意 向 度', '<span class="intent ' + intent.cls + '">' + intent.label + ' ' + intent.star + '</span>') +
      row('关 注 点', state.concerns.length ? state.concerns.join('、') : '暂未明确') +
      row('跟进建议', '<span class="lead-script">' + buildLeadScript() + '</span>') +
    '</div>' +
    '<div class="lead-foot">✅ 已推送给招生老师微信 · ' + nowTime() + '</div>';
  chat.appendChild(card);
  scrollBottom();

  function row(k, v) {
    return '<div class="lead-row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }
}

function maybeSendLeadCard(after) {
  var infoCount = (state.grade ? 1 : 0) + (state.major ? 1 : 0) + (state.foundation ? 1 : 0);
  if (!state.leadSent && state.userTurns >= 4 && infoCount >= 2) {
    setTimeout(function() {
      showTyping();
      setTimeout(function() {
        hideTyping();
        sendLeadCard();
        if (after) after();
      }, 1400);
    }, 900);
    return true;
  }
  return false;
}

/* ================= 实体识别 ================= */
var GRADES = [
  { re: /大一/, v: '大一' },
  { re: /大二/, v: '大二' },
  { re: /大三|应届|快毕业|刚毕业|毕业了/, v: '大三/应届' }
];
var MAJORS = ['会计','计算机','护理','学前教育','学前','机械','电子商务','电商','土木','英语','艺术设计','艺术','金融','市场营销','市营','药学','建筑','电气','软件','工商管理','物流','旅游','法学','汉语言','数控','汽检','园林','口腔','临床','中医'];
var FOUND = [
  { re: /零基础|基础很差|基础差|不太好|不好|薄弱|烂/, v: '偏弱' },
  { re: /一般|还行|马马虎虎/, v: '一般' },
  { re: /不错|很好|还可以|挺好|扎实/, v: '不错' }
];

function extract(text) {
  var i;
  if (!state.grade) {
    for (i = 0; i < GRADES.length; i++) if (GRADES[i].re.test(text)) { state.grade = GRADES[i].v; break; }
  }
  if (!state.major) {
    for (i = 0; i < MAJORS.length; i++) if (text.indexOf(MAJORS[i]) >= 0) { state.major = MAJORS[i] === '学前' ? '学前教育' : MAJORS[i]; break; }
    if (!state.major && /专业/.test(text)) {
      var m = text.replace(/[，。！？\s]/g, '').match(/([一-龥]{2,4})专业/);
      if (m) state.major = m[1];
    }
  }
  if (!state.foundation) {
    for (i = 0; i < FOUND.length; i++) if (FOUND[i].re.test(text)) { state.foundation = FOUND[i].v; break; }
  }
}

/* ================= 规则应答 ================= */
function reply(text) {
  var t = text;
  var out = null, follow = null;

  if (/退费|考不上|保过|包过|不过.*退|考不过/.test(t)) {
    addConcern('保障');
    out = KB.refund;
    follow = null;
  } else if (/多少钱|学费|费用|价格|贵不贵|收费/.test(t)) {
    addConcern('费用');
    out = KB.price;
  } else if (/考什么|科目|考哪|语文|数学|英语|专业课|统考/.test(t)) {
    addConcern('政策');
    out = KB.subjects;
  } else if (/报名|条件|资格|能不能|可以.*考|大二|大一|大三|应届|在校生/.test(t)) {
    addConcern('政策');
    out = KB.policy;
  } else if (/课程|班型|基础班|强化班|冲刺班|6\s?v\s?1|服务|上课|辅导/.test(t)) {
    addConcern('课程');
    out = KB.courses;
  } else if (/校区|地址|在哪|哪里|位置|城市|杭州|宁波|温州/.test(t)) {
    out = KB.campus;
  } else if (/预约|老师|电话|微信|联系|试听/.test(t)) {
    out = KB.booking;
  } else if (/你好|您好|hi|hello|在吗/i.test(t) && state.userTurns <= 1) {
    out = "你好呀～ 我是泓涵教育的招生顾问小涵 😊 想了解浙江专升本的哪方面？报名条件、考试科目、课程费用都可以问我～";
  }

  /* 意向筛选：缺什么问什么 */
  if (!state.grade) follow = "方便说下你现在是读大几吗？我好帮你看看报名条件～";
  else if (!state.major) follow = "你是读什么专业的呀？不同专业类别考的科目不一样，我帮你分析分析～";
  else if (!state.foundation && state.userTurns >= 2) follow = "那你目前基础怎么样？比如英语或者数学，大概是什么水平？我好帮你匹配合适的班型～";

  if (out && follow && state.userTurns <= 4) out = out + "\n\n" + follow;
  if (!out) {
    if (state.grade || state.major) {
      addConcern('意向');
      out = "收到～ " + (state.grade ? state.grade : '') + (state.major ? "的" + state.major + "专业" : '') + "，这个情况很常见 😊\n浙江专升本对你来说机会是很大的，关键是早点开始系统准备。" + (follow ? "\n\n" + follow : "\n\n还想了解考试科目、课程班型还是费用方面呢？");
    } else {
      out = "嗯嗯，我在的～ 你是自己准备专升本，还是帮孩子了解呀？可以说下年级和专业，我帮你看看能报什么、考什么 📚";
    }
  }
  return out;
}

/* ================= 主流程 ================= */
function handleUserText(text, fromDemo) {
  if (!text.trim()) return;
  addMsg('user', text);
  state.userTurns++;
  extract(text);
  clearChips();

  var answer = reply(text);
  aiSay(answer, null, function() {
    if (!maybeSendLeadCard(function() {
      if (!fromDemo) showPostChips();
    })) {
      if (!fromDemo) showPostChips();
    }
  });
}

/* ================= 快捷回复 ================= */
function showChips(list) {
  clearChips();
  list.forEach(function(c) {
    var el = document.createElement('button');
    el.className = 'chip';
    el.textContent = c;
    el.onclick = function() {
      if (state.demoPlaying) return;
      sendFromInput(c);
    };
    chipsBox.appendChild(el);
  });
}
function clearChips() { chipsBox.innerHTML = ''; }
function showPostChips() {
  if (state.leadSent) return;
  var list = [];
  if (!state.grade) list.push('我大二，会计专业');
  if (state.concerns.indexOf('政策') < 0) list.push('大二能报名吗？');
  if (state.concerns.indexOf('费用') < 0) list.push('学费大概多少？');
  if (state.concerns.indexOf('保障') < 0) list.push('考不上能退费吗？');
  if (state.concerns.indexOf('课程') < 0) list.push('有哪些班型？');
  showChips(list.slice(0, 3));
}

/* ================= 输入 ================= */
function sendFromInput(forced) {
  var text = forced != null ? forced : input.value;
  if (!text.trim()) return;
  input.value = '';
  autoGrow();
  handleUserText(text, false);
}
input.addEventListener('input', function() {
  autoGrow();
  sendBtn.disabled = !input.value.trim() || state.demoPlaying;
});
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 96) + 'px';
}
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendFromInput(); }
});
sendBtn.addEventListener('click', function() { sendFromInput(); });

/* ================= 演示剧本 ================= */
var DEMO_SCRIPT = [
  { from: 'ai',   text: "同学你好呀 👋 我是泓涵教育的招生顾问小涵～ 专注浙江专升本好多年了。现在读大几呀？", wait: 1200 },
  { from: 'user', text: "我大二，会计专业的", pause: 1600 },
  { from: 'ai',   text: "大二可以报的！浙江专升本只要是全日制大专在校生或应届毕业生都能报名，大二正是准备的黄金时间 📚\n每年 3 月报名、4 月考试。会计属于经管类，统考考高等数学 + 英语，再加一门专业课。\n\n那你目前基础怎么样？数学和英语大概什么水平？", wait: 2400 },
  { from: 'user', text: "英语基础不太好，数学还可以", pause: 1800 },
  { from: 'ai',   text: "这种情况很典型，别担心 😊 每年都有很多英语薄弱的同学跟我们上岸的。\n泓涵是分层小班教学：基础班从音标语法从零带，强化班考点精讲，冲刺班考前押题。配套 6V1 服务——学习规划师、授课老师、班主任督学、心理辅导、学业答疑、生活老师，六个人围着你一个人转 💪\n浙江多校区，线上线下结合，很方便的。", wait: 2800 },
  { from: 'user', text: "那学费大概多少啊？", pause: 1800 },
  { from: 'ai',   text: KB.price, wait: 2400 },
  { from: 'user', text: "那要是考不上，能退费吗？", pause: 2000 },
  { from: 'ai',   text: KB.refund, wait: 2600 },
  { from: 'ai',   text: "根据咱们刚才聊的，我已经帮你整理好信息啦 👇 招生老师马上会联系你，先给你做一份免费的升本规划～", wait: 1800 },
  { from: 'card' }
];

scriptBtn.addEventListener('click', function() {
  if (state.demoPlaying) { stopDemo(); return; }
  startDemo();
});

function startDemo() {
  resetState();
  state.demoPlaying = true;
  chat.innerHTML = '';
  clearChips();
  addTimeDivider();
  scriptBtn.textContent = '⏹ 停止演示';
  scriptBtn.classList.add('playing');
  demoBanner.classList.add('show');
  sendBtn.disabled = true;
  input.disabled = true;
  playStep(0);
}

function stopDemo() {
  if (state.demoTimer) clearTimeout(state.demoTimer);
  hideTyping();
  state.demoPlaying = false;
  scriptBtn.textContent = '▶ 演示剧本';
  scriptBtn.classList.remove('playing');
  demoBanner.classList.remove('show');
  input.disabled = false;
  sendBtn.disabled = !input.value.trim();
}

function playStep(i) {
  if (!state.demoPlaying || i >= DEMO_SCRIPT.length) {
    if (state.demoPlaying) finishDemo();
    return;
  }
  var step = DEMO_SCRIPT[i];
  if (step.from === 'ai') {
    showTyping();
    state.demoTimer = setTimeout(function() {
      hideTyping();
      addMsg('ai', step.text);
      state.demoTimer = setTimeout(function() { playStep(i + 1); }, 700);
    }, step.wait);
  } else if (step.from === 'user') {
    state.demoTimer = setTimeout(function() {
      addMsg('user', step.text);
      state.userTurns++;
      extract(step.text);
      // 与剧本同步关注点
      if (/学费/.test(step.text)) addConcern('费用');
      if (/退费|考不上/.test(step.text)) addConcern('保障');
      if (/报名|大二/.test(step.text)) addConcern('政策');
      state.demoTimer = setTimeout(function() { playStep(i + 1); }, 400);
    }, step.pause);
  } else if (step.from === 'card') {
    showTyping();
    state.demoTimer = setTimeout(function() {
      hideTyping();
      sendLeadCard();
      state.demoTimer = setTimeout(function() { playStep(i + 1); }, 800);
    }, 1500);
  }
}

function finishDemo() {
  stopDemo();
  showChips(['重新开始演示']);
  var chip = chipsBox.querySelector('.chip');
  if (chip) chip.onclick = function() { if (!state.demoPlaying) startDemo(); };
}

addTimeDivider();

    showChips(['我大二能报名吗？', '学费大概多少？', '考不上能退费吗？']);
  });
}, 300);
</script>
